name: Playwright Tests
# A push to main runs these inside deploy.yml, which deploys only when they pass.
on:
  pull_request:
    branches: [ main, master ]
  workflow_call:

# A newer push to a pull request cancels its older run. A run called from deploy.yml (a push to
# main) gets its own group (run id), so it neither waits nor cancels: github.event_name is the caller's `push` there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The bundle is built once; every browser job downloads it instead of building its own.
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build single-file bundle
      run: npm run build
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        retention-days: 1

  # One job per browser, side by side, each installing only its own browser (Playwright's
  # sharding advice for CI). Each keeps one worker: Firefox and WebKit time out under more
  # parallelism (playwright.config.ts).
  browser:
    name: browser (${{ matrix.project }})
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      # Every browser reports, so one red run names all the browsers it breaks.
      fail-fast: false
      matrix:
        project: [ chromium, firefox, webkit ]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Cache Playwright browser
      id: pw-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright browser and system dependencies
      if: steps.pw-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps ${{ matrix.project }}
    - name: Install system dependencies (browser cached)
      if: steps.pw-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps ${{ matrix.project }}
    - name: Run Playwright tests
      run: npx playwright test --project=${{ matrix.project }}
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.project }}
        path: playwright-report/
        retention-days: 30

  # Branch protection requires a check named `test` (docs/architecture/quality-gates.md, CI):
  # it passes only when every browser passed.
  test:
    needs: browser
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: All browsers passed
      env:
        RESULT: ${{ needs.browser.result }}
      run: |
        echo "Browsers: $RESULT"
        [ "$RESULT" = "success" ]
