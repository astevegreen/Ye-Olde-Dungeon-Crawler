# Bug-report relay (see README.md). Deploy with `npx wrangler deploy` from this folder.
name = "yodc-report-relay"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[vars]
GITHUB_REPO = "astevegreen/Ye-Olde-Dungeon-Crawler"
# "null" is the game opened from a downloaded file (file://).
ALLOWED_ORIGINS = "https://astevegreen.github.io,null"

# GITHUB_TOKEN is a secret, never committed: `npx wrangler secret put GITHUB_TOKEN`.

# Screenshots shown in issues (created with `npx wrangler kv namespace create SHOTS`).
[[kv_namespaces]]
binding = "SHOTS"
id = "803123c2753f4209af135b506c2e5970"

# Optional: at most 5 reports per minute from one IP.
# [[ratelimits]]
# name = "REPORT_LIMITER"
# namespace_id = "1001"
#   [ratelimits.simple]
#   limit = 5
#   period = 60
