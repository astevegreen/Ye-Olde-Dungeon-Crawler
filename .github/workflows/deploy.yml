name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Quality Gates
        run: |
          npm run lint
          npm test
          npm run sim
          npm run validate:schema

      # Hidden source maps: nothing in the deployed HTML points at them, and they are moved
      # out of dist/ before upload, so they never ship. They are kept as a build artifact
      # (with the HTML they map) for `npm run map:stack` to resolve bug-report stack traces.
      - name: Build static bundles (with hidden source maps)
        env:
          SOURCEMAP: hidden
        run: |
          npm run build:cotw
          mkdir -p sourcemaps/cotw && mv dist/*.map sourcemaps/cotw/ && cp dist/index.html sourcemaps/cotw/
          npm run build:warcraft
          mkdir -p sourcemaps/warcraft && mv dist/*.map sourcemaps/warcraft/ && cp dist/warcraft.html sourcemaps/warcraft/

      - name: Keep source maps for this build
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ github.sha }}
          path: sourcemaps
          retention-days: 90

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
