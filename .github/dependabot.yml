# Weekly version updates as pull requests, which run ci.yml and playwright.yml before anything
# merges. Minor and patch updates come grouped, one pull request per ecosystem; a major version
# comes on its own. A release waits 7 days first, so a broken or hijacked release is usually
# pulled before it reaches us. Security updates are separate (Dependabot alerts) and skip the wait,
# but GitHub raises no alert for an action pinned by commit SHA, as the workflows pin theirs: an
# action's security fix arrives with the weekly version updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # `typescript-5` is TypeScript 5 under an npm alias, kept for the compiler API that
      # scripts/check-engine-encapsulation.ts needs and TypeScript 7 no longer ships.
      - dependency-name: typescript-5
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
