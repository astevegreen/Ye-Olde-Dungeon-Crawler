name: Claude Code
# @claude in an issue or PR comment starts Claude Code on a GitHub runner.
# It works on its own branch and opens a pull request; main changes only when
# the owner merges. Billed to the Claude Console API key in the
# ANTHROPIC_API_KEY repository secret, not to the owner's Claude plan.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # --ignore-scripts skips package lifecycle scripts; the one this repo
      # needs, `prepare` (git hooks), is run by hand on the next line.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          git config core.hooksPath .githooks

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps

      - uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1.0.267
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*)"
            --append-system-prompt "You are running in a GitHub Actions runner, not the owner's Windows machine. Work only on your own branch and finish with a pull request into main; never push to main. Follow CLAUDE.md, except: agy and scripts/second-look.mjs are not available here, so skip the second look and say so in the PR, and leave the push lock and ci:watch alone. Keep runs short: run the relevant tests while iterating and npm run gates before the final commit."
