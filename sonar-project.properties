# ==============================================================================
# SonarQube / SonarCloud Scanner Configuration
# ==============================================================================

# Project Identification
sonar.organization=astevegreen
sonar.projectKey=astevegreen_Castle
sonar.projectName=Castle of the Winds
sonar.projectVersion=0.1.0

# Encoding
sonar.sourceEncoding=UTF-8

# ------------------------------------------------------------------------------
# Source & Test Scope Definitions
# ------------------------------------------------------------------------------
# Strictly target src/ for source code analysis
sonar.sources=src

# Test directories
sonar.tests=tests

# Inclusions: strictly target files under src/
sonar.inclusions=src/**

# Exclusions: exclude all build artifacts, vendor libraries, and generated files
# to fix 'context deadline exceeded' timeouts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/reports/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.bundle.js,\
  **/*.chunk.js,\
  **/*.map,\
  **/*.lock,\
  package-lock.json,\
  **/*.d.ts

# Test Inclusions & Exclusions
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.spec.ts,tests/**/*.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/reports/**

# ------------------------------------------------------------------------------
# Performance & Scanner Tuning
# ------------------------------------------------------------------------------
# Prevent premature timeout during compute engine processing
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Allocate adequate heap space for Node.js JS/TS analyzer
sonar.javascript.node.maxspace=4096

# Duplicate Code Detection (CPD) Exclusions
sonar.cpd.exclusions=tests/**,**/*.test.ts,**/*.spec.ts
