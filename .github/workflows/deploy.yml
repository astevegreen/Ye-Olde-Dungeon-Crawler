name: Deploy to GitHub Pages

# The deploy waits for the browser tests, so players only get a build that passed in all three
# browsers on Linux (docs/architecture/quality-gates.md, CI). Every push runs the gates; a push that
# ships nothing (docs, tooling, tests only: scripts/lib/deploy-scope.mjs) skips the browsers and the deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      ships: ${{ steps.scope.outputs.ships }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decide whether this push ships
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/deploy-scope.mjs

  browsers:
    needs: scope
    if: needs.scope.outputs.ships == 'true'
    uses: ./.github/workflows/playwright.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Quality Gates
        run: |
          npm run lint
          npm test
          npm run sim
          npm run validate:schema

      # Hidden source maps: nothing in the deployed HTML points at them, and they are moved
      # out of dist/ before upload, so they never ship. They are kept as a build artifact
      # (with the HTML they map) for `npm run map:stack` to resolve bug-report stack traces.
      - name: Build static bundles (with hidden source maps)
        env:
          SOURCEMAP: hidden
          # Bug-report relay URL (relay/README.md). Unset, the game falls back to GitHub's page.
          REPORT_RELAY_URL: ${{ vars.REPORT_RELAY_URL }}
        run: |
          npm run build:cotw
          mkdir -p sourcemaps/cotw && mv dist/*.map sourcemaps/cotw/ && cp dist/index.html sourcemaps/cotw/

      - name: Keep source maps for this build
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ github.sha }}
          path: sourcemaps
          retention-days: 90

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    needs: [scope, browsers, build]
    if: needs.scope.outputs.ships == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Browser runs finish out of order, so an older push could finish its tests last and
      # deploy over a newer one. Only the branch tip deploys; a newer push deploys itself,
      # unless nothing after this commit ships, and then the newer run deploys nothing.
      - name: Check this commit is still the tip of the branch
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          elif BEFORE="${{ github.sha }}" GITHUB_SHA="$tip" GITHUB_OUTPUT=/dev/null node scripts/deploy-scope.mjs | grep -q '^ships=false'; then
            echo "::notice::Deployed: ${{ github.ref_name }} has moved on to ${tip}, but nothing after this commit ships."
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deployed: ${{ github.ref_name }} has moved on to ${tip}, whose run deploys it."
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.tip.outputs.current == 'true'
        uses: actions/deploy-pages@v4
